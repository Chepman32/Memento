buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            // The original com.arthenica artifacts were removed after FFmpegKit
            // was retired. Keep the React Native 6.0.2 bridge, but resolve its
            // Android binary from the maintained, API-compatible 6.0 line.
            substitute module("com.arthenica:ffmpeg-kit-https") using module("dev.ffmpegkit-maintained:ffmpeg-kit-https:6.0.3")
        }
    }
}
